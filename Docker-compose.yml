services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-mindplex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindplex}
      POSTGRES_DB: ${DB_NAME:-semantic}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: ${DOCKER_TARGET:-development}
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${DB_USER:-mindplex}:${DB_PASSWORD:-mindplex}@db:5432/${DB_NAME:-semantic}
      DB_ADMIN_DATABASE: ${DB_ADMIN_DATABASE:-postgres}
      DB_REQUIRE_SSL: ${DB_REQUIRE_SSL:-false}
      REDIS_URL: redis://redis:6379
      REDIS_TLS: ${REDIS_TLS:-false}
      AWS_BEDROCK_ACCESS_KEY: ${AWS_BEDROCK_ACCESS_KEY:-}
      AWS_BEDROCK_SECRET_KEY: ${AWS_BEDROCK_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_MAX_ATTEMPTS: ${AWS_MAX_ATTEMPTS:-3}
      AWS_BEDROCK_HTTP1: ${AWS_BEDROCK_HTTP1:-true}
      AWS_RETRY_BASE_DELAY_MS: ${AWS_RETRY_BASE_DELAY_MS:-750}
      AWS_BEDROCK_REQUEST_TIMEOUT_MS: ${AWS_BEDROCK_REQUEST_TIMEOUT_MS:-30000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      API_KEY: ${API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_PUBLIC_JWK: ${JWT_PUBLIC_JWK:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-}
      JWT_ALG: ${JWT_ALG:-}
      JWT_ALLOWED_ALGS: ${JWT_ALLOWED_ALGS:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-}
    command: >
      /bin/sh -c "
      echo '[startup] db:setup' &&
      bun run db:setup &&
      echo '[startup] db:dev-migrate' &&
      bun run db:dev-migrate &&
      echo '[startup] api start' &&
      bun run dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./drizzle
        - action: rebuild
          path: ./drizzle.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
volumes:
  pgdata:
  redisdata:
