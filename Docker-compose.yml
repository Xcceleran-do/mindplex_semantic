services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mindplex
      POSTGRES_PASSWORD: mindplex
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindplex -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mindplex:mindplex@db:5432/semantic
      DB_ADMIN_DATABASE: postgres
      DB_REQUIRE_SSL: "false"
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      AWS_BEDROCK_ACCESS_KEY: ${AWS_BEDROCK_ACCESS_KEY:-}
      AWS_BEDROCK_SECRET_KEY: ${AWS_BEDROCK_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_MAX_ATTEMPTS: ${AWS_MAX_ATTEMPTS:-3}
      AWS_BEDROCK_HTTP1: ${AWS_BEDROCK_HTTP1:-true}
      AWS_RETRY_BASE_DELAY_MS: ${AWS_RETRY_BASE_DELAY_MS:-750}
      AWS_BEDROCK_REQUEST_TIMEOUT_MS: ${AWS_BEDROCK_REQUEST_TIMEOUT_MS:-30000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-1}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      API_KEY: ${API_KEY:-}
    command: >
      /bin/sh -c "
      echo '[startup] db:setup' &&
      bun run db:setup &&
      echo '[startup] db:dev-migrate' &&
      bun run db:dev-migrate &&
      echo '[startup] api start' &&
      bun run dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
volumes:
  pgdata:
  redisdata:
